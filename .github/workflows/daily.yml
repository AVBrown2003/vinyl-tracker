name: daily

on:
  schedule:
    - cron: "7 10 * * *"   # every day, 10:07 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull the source, build history, write status, open the day's issue
        env:
          GH_TOKEN: ${{ github.token }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}   # optional; the run works without it
        run: python -m tracker.pipeline
      - name: Commit raw files, history and status
        run: |
          git config user.name "vinyl-tracker[bot]"
          git config user.email "vinyl-tracker@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Daily run $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
