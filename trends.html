<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trends - The Vinyl Vault</title>
<meta name="description" content="What the history says: price moves, spreads, scarcity and demand across the tracked records.">
<meta name="theme-color" content="#17161a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/style.css?v=8">
<script src="assets/common.js?v=8" defer></script>
<script src="assets/charts.js?v=8" defer></script>
<script src="assets/trends.js?v=8" defer></script>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="eyebrow">What the history says</div>
  <h1>Trends</h1>
  <p class="lede" id="intro">Loading the history...</p>
</div></header>
<main>
  <div class="panel">
    <h2 style="margin-top:0">Time</h2>
    <div class="controls" style="grid-template-columns:auto minmax(180px,260px)">
      <div class="flabel">Window for every number and chart below
        <div class="seg" id="t-window" style="margin:4px 0 0">
          <button type="button" data-w="daily" aria-pressed="false">Daily</button>
          <button type="button" data-w="week" aria-pressed="false">Weekly</button>
          <button type="button" data-w="month" aria-pressed="false">Monthly</button>
          <button type="button" data-w="year" aria-pressed="false">Yearly</button>
          <button type="button" data-w="decade" aria-pressed="false">Decade</button>
          <button type="button" data-w="all" aria-pressed="true">All time</button>
        </div>
      </div>
      <label>Group the chart by
        <select id="t-group"><option value="day">Day</option><option value="month">Month</option><option value="year">Year</option><option value="decade">Decade</option></select>
      </label>
    </div>
    <p class="note" id="window-note"></p>
  </div>

  <div class="panel">
    <h2 style="margin-top:0">Every value over the days</h2>
    <div class="controls" style="grid-template-columns:minmax(200px,320px) 1fr">
      <label>Value <select id="t-value"></select></label>
      <div class="flabel">Records shown
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
          <button type="button" class="btn" data-pick="top">Top 5 by price</button>
          <button type="button" class="btn" data-pick="all">All</button>
          <button type="button" class="btn" data-pick="none">None</button>
        </div>
      </div>
    </div>
    <div class="picker" id="picker"></div>
    <div class="chart" id="line-chart"></div>
    <p class="note" id="line-note"></p>
  </div>

  <div id="findings"></div>
</main>
<footer>Every number on this page is computed in your browser from data/history.csv, so it changes as the history grows.</footer>
</body>
</html>
